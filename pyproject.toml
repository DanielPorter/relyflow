[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "relyflow"
version = "0.0.1"
description = "Amortized Bayesian inference for cognitive models of human reliance on automated decision aids."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Porter" }]
requires-python = ">=3.12"
keywords = [
    "automation",
    "human factors",
    "trust in automation",
    "evidence accumulation",
    "cognitive modeling",
    "amortized inference",
    "simulation-based inference",
    "bayesflow",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "bayesflow>=2.0.12",
    "numpy>=2.2",
    "pandas>=2.2",
    "scipy>=1.15",
]

[project.optional-dependencies]
# BayesFlow runs on Keras 3, which needs one backend installed.
jax = ["jax>=0.6"]
torch = ["torch>=2.6"]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.17",
]

[project.urls]
Repository = "https://github.com/DanielPorter/relyflow"
Issues = "https://github.com/DanielPorter/relyflow/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/relyflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["slow: long-running tests (network training, large simulation sweeps)"]
filterwarnings = [
    # Keras converting tensors under NumPy >= 2.4; upstream, harmless.
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
]

[tool.coverage.run]
source = ["relyflow"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "NPY", "SIM", "RUF"]
